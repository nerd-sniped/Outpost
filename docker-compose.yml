# Outpost — rung 1 (self-host), Phase 1 baseline: localhost only.
#
#   docker compose up -d --build
#   open http://localhost:3000
#
# For phone/remote access, add the Phase 2 Tailscale overlay — reachable as
# https://freecad.<tailnet>.ts.net with zero open ports and no gatekeeper:
#   docker compose -f docker-compose.yml -f compose.tailscale.yml up -d --build
# On its own, this file exposes port 3000 on localhost only.

services:
  outpost:
    build:
      context: .
      # Bump these to change pins without editing the Dockerfile.
      args:
        FREECAD_VERSION: "1.1.1"
        GITPDM_VERSION: "v0.6.5"
        HISTORY_WB_VERSION: "v0.1.0"
    image: outpost:dev
    container_name: outpost
    # Selkies needs real shared memory for the browser/GL pipeline.
    shm_size: "1gb"
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"   # Selkies HTTP (browser)
      - "127.0.0.1:8090:8090"   # Outpost /healthz
    tmpfs:
      - /run/outpost   # Phase 3: gatekeeper's token handoff (GITPDM_TOKEN_FILE).
                       # Unused/harmless when AUTH_MODE != gatekeeper.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped
