name: CI

# Cheapest canaries per the plan's "Test infrastructure" section: the image builds,
# a container boots and stays up, and the headless auth probe is wired correctly.
# Full browser round-trips stay manual (Selkies E2E isn't worth its upkeep at this
# scale). The GitPDM<->HistoryWorkbench pair test activates when the HW adapter lands.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gatekeeper compile check (cheapest canary, runs before the image build)
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: cd gatekeeper && go vet ./... && go build -o /dev/null .

      - name: Build image
        run: docker build -t outpost:ci .

      - name: Boot smoke test (container stays up 60s, /healthz answers)
        run: |
          docker run -d --name outpost --shm-size=1gb -p 8080:8080 outpost:ci
          # /healthz should come up; auth is legitimately "absent" with no token.
          for i in $(seq 1 24); do
            if curl -fsS http://localhost:8080/healthz; then ok=1; break; fi
            sleep 5
          done
          echo
          [ "${ok:-0}" = 1 ] || { echo "healthz never came up"; docker logs outpost; exit 1; }
          sleep 60
          docker ps --filter name=outpost --filter status=running --format '{{.Names}}' \
            | grep -q outpost || { echo "container did not stay up"; docker logs outpost; exit 1; }

      - name: Auth probe wired (headless, no token -> clean FAILED exit 1, never hangs)
        run: |
          out=$(docker exec outpost outpost-authcheck || true)
          echo "$out"
          echo "$out" | grep -q "FAILED" || { echo "probe did not report FAILED cleanly"; exit 1; }

      - name: Gatekeeper smoke test (no real GitHub account needed)
        run: |
          docker run -d --name gk --shm-size=1gb \
            -e AUTH_MODE=gatekeeper -e PORT=8081 \
            -e GITHUB_CLIENT_ID=dummy -e ALLOWED_GITHUB_USER=nobody \
            -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -p 8081:8081 outpost:ci
          for i in $(seq 1 24); do
            if curl -fsS http://localhost:8081/healthz >/dev/null; then ok=1; break; fi
            sleep 5
          done
          [ "${ok:-0}" = 1 ] || { echo "gatekeeper never came up"; docker logs gk; exit 1; }
          # No cookie -> the code-prompt page, on ANY path, never Selkies content.
          body=$(curl -fsS http://localhost:8081/some/random/looking/path)
          echo "$body" | grep -q "outpost-gatekeeper" || { echo "did not get the code-prompt page"; docker logs gk; exit 1; }
          # Selkies is not published at all when only the gatekeeper port is exposed.
          if curl -fsS --max-time 2 http://localhost:3000 >/dev/null 2>&1; then
            echo "Selkies reachable without going through the gatekeeper!"; exit 1
          fi
          # The dummy client id/secret must never appear in the container's logs.
          docker logs gk 2>&1 | grep -q "dummy" && { echo "dummy client id leaked into logs"; exit 1; } || true
          docker rm -f gk

      # Optional: closes Phase 0.2 when a scoped throwaway PAT secret is configured.
      - name: Live auth smoke (0.2) — only if a PAT secret is present
        if: ${{ secrets.GITPDM_TEST_PAT != '' }}
        env:
          PAT: ${{ secrets.GITPDM_TEST_PAT }}
        run: |
          out=$(docker exec -e GITPDM_TOKEN="$PAT" -e GITPDM_PROVIDER=github \
                  outpost outpost-authcheck)
          echo "$out"
          echo "$out" | grep -q "OK — source=env" || { echo "0.2 live smoke failed"; exit 1; }

      - name: Teardown
        if: always()
        run: docker rm -f outpost gk || true
